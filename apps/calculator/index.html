<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator · Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="../../style-kit/tokens.css">
<link rel="stylesheet" href="../../style-kit/base.css">
<link rel="stylesheet" href="../../style-kit/chrome.css">
<link rel="stylesheet" href="../../style-kit/apps.css">
<style>
  .screen { padding: 10px 14px; display: grid; gap: 2px; text-align: right; min-height: 96px; align-content: end; }
  .screen .expr { font: 22px/1.1 var(--font-lcd); opacity: .6; min-height: 24px; overflow-wrap: anywhere; }
  .screen .res { font: 54px/1 var(--font-lcd); overflow-wrap: anywhere; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .keys .btn { min-height: 46px; font-size: 16px; }
  .keys .op { color: var(--ball); }
  .keys .eq { background: linear-gradient(180deg, color-mix(in srgb, var(--ball) 45%, #2b2640), color-mix(in srgb, var(--ball) 22%, #1a1724)); color: #fff; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 12px; }
  .hist { max-height: 340px; overflow: auto; }
  .hist .item { cursor: pointer; display: grid; text-align: right; gap: 0; }
  .tempo { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  .tempo .cell { padding: 8px 10px; background: #000; border-radius: 2px; box-shadow: inset -1px -1px 0 #3a3450; display: grid; gap: 2px; }
  .tempo .cell b { font: 26px/1 var(--font-lcd); color: var(--ball); }
  .tempo .cell small { font-size: 11px; color: var(--ink-faint); }
  .bpmbig { width: 120px !important; font: 34px/1 var(--font-lcd) !important; text-align: center; flex: 0 0 auto !important; min-width: 0 !important; }
  @media (max-width: 560px) { .main { grid-template-columns: 1fr; } }
</style>
</head>
<body class="app">
  <nav class="tabs" id="tabs" role="tablist">
    <button class="btn" role="tab" data-tab="calc">Calculator</button>
    <button class="btn" role="tab" data-tab="tempo">Tempo</button>
  </nav>
  <section class="pane" data-pane="calc">
    <div class="main">
      <div style="display:grid;gap:10px">
        <div class="lcd screen" aria-live="polite"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
        <div class="keys" id="keys"></div>
      </div>
      <div style="display:grid;gap:6px;align-content:start"><span class="lbl">History</span><div class="list hist" id="hist"></div><p class="hint" id="histHint">Sums you work out appear here. Click one to use its answer.</p></div>
    </div>
  </section>
  <section class="pane" data-pane="tempo" hidden>
    <div class="row"><span class="lbl">Tempo</span><input type="number" class="bpmbig" id="bpm" min="20" max="400" step="0.1" value="120" aria-label="Beats per minute"><span class="lbl">BPM</span><button class="btn" id="tap">Tap</button><span class="hint" id="tapHint">Tap along four times or more.</span></div>
    <span class="lbl">Note lengths (for delays and reverb times)</span>
    <div class="tempo" id="lengths"></div>
  </section>
  <script type="module">
    import "../../core/os-link.js";
    import { applyTheme, onTheme } from "../../core/theme.js";
    import { esc } from "../../style-kit/ui.js";
    applyTheme(); onTheme(applyTheme);
    const $ = id => document.getElementById(id), KEY = "neon-os:calculator";
    let S = { tab: "calc", hist: [], bpm: 120 };
    try { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
    const showTab = t => { S.tab = t; save(); document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t))); document.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== t); };
    $("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });

    // ---------- the sums: read left to right with × and ÷ before + and − (no eval) ----------
    function calc(src) {
      const toks = src.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").match(/\d*\.?\d+(e[+-]?\d+)?|[-+*/%()]/gi);
      if (!toks) return null;
      let i = 0;
      const peek = () => toks[i], next = () => toks[i++];
      function num() {
        let t = next();
        if (t === "-") return -num();
        if (t === "+") return num();
        if (t === "(") { const v = add(); if (next() !== ")") throw 0; return post(v); }
        const v = parseFloat(t); if (isNaN(v)) throw 0; return post(v);
      }
      function post(v) { while (peek() === "%") { next(); v = v / 100; } return v; }
      function mul() { let v = num(); while (peek() === "*" || peek() === "/") { const o = next(), r = num(); v = o === "*" ? v * r : v / r; } return v; }
      function add() { let v = mul(); while (peek() === "+" || peek() === "-") { const o = next(), r = mul(); v = o === "+" ? v + r : v - r; } return v; }
      try { const v = add(); return i === toks.length && isFinite(v) ? v : null; } catch (e) { return null; }
    }
    const show = v => v == null ? "Error" : String(Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-9 && v !== 0) ? v.toExponential(8) : +v.toPrecision(12));
    let expr = "", done = false;
    const KEYS = [["C", "fn"], ["(", "fn"], [")", "fn"], ["÷", "op"], ["7"], ["8"], ["9"], ["×", "op"], ["4"], ["5"], ["6"], ["−", "op"], ["1"], ["2"], ["3"], ["+", "op"], ["%", "fn"], ["0"], ["."], ["=", "eq"]];
    $("keys").innerHTML = KEYS.map(([k, c]) => `<button class="btn${c ? " " + c : ""}" data-k="${k}">${k}</button>`).join("");
    function draw() { $("expr").textContent = done ? expr + " =" : expr; $("res").textContent = done ? show(calc(expr)) : (expr ? (calc(expr) == null ? expr.slice(-14) || "0" : show(calc(expr))) : "0"); }
    function press(k) {
      if (k === "C") { expr = ""; done = false; }
      else if (k === "⌫") { if (done) { done = false; } else expr = expr.slice(0, -1); }
      else if (k === "=") {
        const v = calc(expr); if (v == null || !expr) { draw(); return; }
        S.hist.unshift({ expr, v }); S.hist = S.hist.slice(0, 30); save(); drawHist(); done = true;
      } else {
        if (done) { expr = /[\d.(]/.test(k) ? "" : show(calc(expr)); done = false; }
        expr += k;
      }
      draw();
    }
    $("keys").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) press(b.dataset.k); });
    addEventListener("keydown", e => {
      if (S.tab !== "calc" || e.target.closest("input") || e.ctrlKey || e.metaKey || e.altKey) return;
      const map = { "*": "×", "/": "÷", "-": "−", Enter: "=", "=": "=", Escape: "C", Backspace: "⌫", Delete: "C" }, k = map[e.key] || (/^[\d.+%()]$/.test(e.key) ? e.key : null);
      if (k) { e.preventDefault(); press(k); }
    });
    function drawHist() {
      $("hist").innerHTML = S.hist.map((h, i) => `<div class="item" data-i="${i}" title="Use this answer"><small>${esc(h.expr)} =</small><strong>${esc(show(h.v))}</strong></div>`).join("");
      $("histHint").hidden = !!S.hist.length;
    }
    $("hist").addEventListener("click", e => { const it = e.target.closest("[data-i]"); if (!it) return; expr = show(S.hist[+it.dataset.i].v); done = false; draw(); });

    // ---------- tempo: note lengths in milliseconds, and tap tempo ----------
    const NOTES = [["Bar (4 beats)", 4], ["1/2", 2], ["1/4 (a beat)", 1], ["1/8", 0.5], ["1/16", 0.25], ["1/32", 0.125], ["Dotted 1/8", 0.75], ["Dotted 1/4", 1.5], ["Triplet 1/8", 1 / 3], ["Triplet 1/4", 2 / 3]];
    function drawTempo() {
      const b = +$("bpm").value || 120, beat = 60000 / b;
      $("lengths").innerHTML = NOTES.map(([n, k]) => `<div class="cell"><small>${n}</small><b>${(beat * k).toFixed(1)} ms</b><small>${(1000 / (beat * k)).toFixed(2)} Hz</small></div>`).join("");
    }
    $("bpm").value = S.bpm;
    $("bpm").addEventListener("input", () => { S.bpm = +$("bpm").value || 120; save(); drawTempo(); });
    let taps = [];
    $("tap").addEventListener("click", () => {
      const t = performance.now(); if (taps.length && t - taps[taps.length - 1] > 2500) taps = [];
      taps.push(t); if (taps.length > 12) taps.shift();
      if (taps.length >= 4) { const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); $("bpm").value = (60000 / avg).toFixed(1); S.bpm = +$("bpm").value; save(); drawTempo(); $("tapHint").textContent = `${taps.length} taps`; }
      else $("tapHint").textContent = `${taps.length} tap${taps.length === 1 ? "" : "s"}…`;
    });
    showTab(S.tab); draw(); drawHist(); drawTempo();
  </script>
</body>
</html>
