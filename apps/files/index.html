<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files · Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="../../style-kit/tokens.css">
<link rel="stylesheet" href="../../style-kit/base.css">
<link rel="stylesheet" href="../../style-kit/chrome.css">
<link rel="stylesheet" href="../../style-kit/library.css">
<style>
  body { height: 100%; min-height: 320px; padding: 8px; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 8px; overflow: auto; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .path { flex: 1; min-width: 120px; font-size: 18px; line-height: 24px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { display: flex; align-items: center; height: 24px; padding: 0 8px; background: #000; box-shadow: inset -1px -1px 0 #3a3450; border-radius: 2px; }
  .search input { background: none; border: 0; outline: none; width: 130px; font-size: 12.5px; }
  .search:focus-within { box-shadow: 0 0 0 1px var(--ball); }
  .lwell { flex: 1; }
  .lhead, .lrow.song { grid-template-columns: 18px minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 0.9fr) 52px 64px 84px; min-width: 760px; }
  .status { font-size: 11.5px; color: var(--ink-dim); min-height: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { padding: 10px 12px; font-family: var(--font-lcd); font-size: 19px; line-height: 1.25; color: var(--ball); white-space: pre-wrap; overflow: auto; flex: 1; }
  /* the file manager (fm.js) */
  #fmMain[hidden], #libMain[hidden] { display: none; }
  .fm-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fm-sp { flex: 1; }
  .fm-crumbs { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 2px; font-size: 17px; line-height: 24px; padding: 0 6px; overflow: hidden; white-space: nowrap; }
  .fm-crumbs button { font: inherit; color: inherit; padding: 0 3px; border-radius: 2px; } .fm-crumbs button:hover { background: #ffffff14; }
  .fm-crumbs i { font-style: normal; opacity: .5; }
  .fm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .fm-list { overflow: auto; min-height: 0; }
  .fm-head, .fm-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) 80px 180px; min-width: 540px; }
  .fm-row { cursor: default; }
  .fm-row .num { text-align: right; padding-right: 10px; }
  .fm-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .fm-name svg { width: 16px; height: 16px; fill: var(--ball); flex: none; }
  .fm-name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-name small { color: var(--ink-faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-row.drop { box-shadow: inset 0 0 0 1px var(--ball); }
  .fm-list.grid .fm-head { display: none; }
  .fm-list.grid #fmRows { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; padding: 6px; }
  .fm-list.grid .fm-row { min-width: 0; display: grid; grid-template-columns: 1fr; height: auto !important; padding: 8px 4px; text-align: center; border-radius: 3px; }
  .fm-list.grid .fm-row > span:not(.fm-name) { display: none; }
  .fm-list.grid .fm-name { flex-direction: column; } .fm-list.grid .fm-name svg { width: 34px; height: 34px; }
  .fm-list.grid .fm-name b { white-space: normal; word-break: break-word; font-size: 11.5px; max-height: 2.6em; overflow: hidden; }
  .fm-prev { width: 240px; display: grid; align-content: start; gap: 8px; padding: 10px; background: #0a0810; border: 1px solid #000; box-shadow: inset -1px -1px 0 #3a3450; border-radius: 2px; overflow: auto; }
  .fm-prev[hidden] { display: none; }
  .fm-prev img, .fm-prev video { width: 100%; border-radius: 2px; background: #000; }
  .fm-prev audio { width: 100%; }
  .fm-prev pre { margin: 0; max-height: 300px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--ink-dim); background: #000; padding: 8px; border-radius: 2px; }
  .fm-big svg { width: 64px; height: 64px; fill: var(--ball); }
  .ltree .place { display: flex; align-items: center; gap: 8px; }
  @media (max-width: 560px) { body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .ltree { max-height: 140px; } }
</style>
</head>
<body>
  <nav class="ltree" id="tree" aria-label="Folders"></nav>
  <main id="fmMain" hidden></main>
  <main id="libMain">
    <div class="tools">
      <button class="btn" id="back" hidden>‹ Back</button>
      <span class="lcd path" id="path">/</span>
      <label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search"></label>
      <button class="btn" id="play" disabled>Play</button>
      <button class="btn" id="save" disabled>Download</button>
      <button class="btn" id="rename" disabled title="Edit details and cover art (Ctrl+I)">Edit details</button>
      <button class="btn" id="tidy" hidden title="Merge names spelled more than one way">Tidy names</button>
      <button class="btn" id="selAll" title="Select every song shown (Ctrl+A)">Select all</button>
      <button class="btn" id="del" disabled>Delete</button>
    </div>
    <div class="lwell" id="list" role="grid" aria-label="Files" tabindex="0">
      <div class="lhead" role="row" id="head"><span data-sort="fav">★</span><span data-sort="title">Name</span><span data-sort="artist">Artist</span><span data-sort="album">Album</span><span data-sort="genre">Genre</span><span data-sort="type">Type</span><span data-sort="size" style="text-align:right">Size</span><span data-sort="added" style="text-align:right">Added</span></div>
      <div id="rows"></div>
    </div>
    <div class="status" id="status"></div>
  </main>
  <script type="module">
    import "../../core/os-link.js";
    import { applyTheme, onTheme } from "../../core/theme.js";
    import { openDb, all, put, del, notifyLibraryChange, onLibraryChange } from "../../core/backup.js";
    import { buildGroups, sortSongs, listState, viewSongs, viewGroups, viewTitle, isGroupView, openGroup, parentView, searchSongs, searchGroups, groupNote } from "../../core/library.js";
    import { treeHTML, treeClick, treeIcon, wireSortHead } from "../../core/library-tree.js";
    import { vlist } from "../../style-kit/vlist.js";
    import { esc, toast, dialog } from "../../style-kit/ui.js";
    import { fileOf } from "../../core/linked.js";
    import { editDetails, tidyNames } from "../../core/details.js";
    import { loadNotebook, saveNotebook, noteTitle, notebookText } from "../../core/notebook.js";
    import { mountFM, listPlaces, linkPlace, unlinkPlace } from "./fm.js";
    applyTheme(); onTheme(applyTheme);

    const $ = id => document.getElementById(id);
    const mb = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : (n / 1e6).toFixed(1) + " MB";
    const ext = t => ({ "audio/mpeg": "MP3", "audio/flac": "FLAC", "audio/wav": "WAV", "audio/x-wav": "WAV", "audio/ogg": "OGG", "audio/mp4": "M4A", "audio/aac": "AAC", "audio/webm": "WEBM" }[(t || "").split(";")[0]] || "AUDIO");
    const day = s => s ? new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
    const pathOf = v => v.type === "notes" ? "/DOCUMENTS/NOTES" : "/" + ({ all: "LIBRARY/SONGS", artists: "LIBRARY/ARTISTS", albums: "LIBRARY/ALBUMS", genres: "LIBRARY/GENRES", artist: "LIBRARY/ARTISTS/", album: "LIBRARY/ALBUMS/", genre: "LIBRARY/GENRES/", smart: "SMART/", pl: "PLAYLISTS/" }[v.type] || "") +
      (["artist", "album", "genre", "smart", "pl"].includes(v.type) ? viewTitle(v, playlists, groups) : "").toUpperCase();

    // the section and sort are remembered between visits
    const LS = listState("neon-os:files");
    let tracks = [], playlists = [], groups = buildGroups([]), view = LS.view, sel = new Set(), anchor = null, shown = [];
    const list = vlist($("list"), $("rows"), { rowHeight: 26, head: 24, empty: emptyText });
    function emptyText() {
      if ($("q").value.trim()) return `<div class="lempty"><b>Nothing matches.</b>Try a title, artist, album or genre.</div>`;
      if (view.type === "pl") return `<div class="lempty"><b>This playlist is empty.</b>Add songs to it from Amp's library.</div>`;
      if (view.type === "smart") return `<div class="lempty"><b>Nothing here yet.</b>${view.id === "fav" ? "Click the star beside a song to add it." : view.id.startsWith("b") ? "Songs appear once their tempo has been worked out." : "Songs appear here as you play them in Amp."}</div>`;
      return `<div class="lempty"><b>No songs yet.</b>Add songs in Amp, or restore a backup in Settings.</div>`;
    }
    async function load() {
      try { const db = await openDb(); tracks = await all(db, "tracks"); playlists = await all(db, "playlists"); db.close(); }
      catch (e) { tracks = []; playlists = []; $("status").textContent = "This browser can't open the library."; }
      tracks.forEach(t => { if (t.coverBlob && !t.coverUrl) t.coverUrl = URL.createObjectURL(t.coverBlob); });
      playlists.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      groups = buildGroups(tracks);
      if (view.type === "pl" && !playlists.some(p => p.id === view.id)) view = { type: "all" };
      const live = new Set(tracks.map(t => t.id)); sel = new Set([...sel].filter(id => live.has(id)));
      render(true);
    }
    const byId = id => tracks.find(t => t.id === id);

    function render(keepScroll) {
      $("tree").innerHTML = treeHTML(view, tracks, playlists, groups, `<span class="head lbl">Documents</span><button class="fold" data-notes aria-current="${view.type === "notes"}">${treeIcon("songs")}<span class="name">Notes</span></button>` + placesHTML());
      $("path").textContent = pathOf(view);
      $("back").hidden = !["artist", "album", "genre"].includes(view.type);
      $("tidy").hidden = !["artists", "albums", "genres"].includes(view.type);
      if (view.type === "notes") {
        const nb = loadNotebook();
        $("list").classList.add("groups");
        $("rows").innerHTML = nb.notes.length ? nb.notes.slice().sort((a, b) => b.updated - a.updated).map(n => `<div class="note"><b>${esc(noteTitle(n))}</b>${n.folder ? ` <small>· ${esc(n.folder)}</small>` : ""}\n${esc(n.text.split("\n").slice(1).join("\n").trim().slice(0, 400))}</div>`).join("") : `<div class="note">Notes is empty.</div>`;
        $("status").textContent = `${nb.notes.length} note${nb.notes.length === 1 ? "" : "s"} · open Notes to edit · Download saves them all as one text file`;
        ["play", "rename", "del"].forEach(id => $(id).disabled = true); $("save").disabled = !nb.notes.length;
        return;
      }
      const grp = isGroupView(view);
      $("list").classList.toggle("groups", grp);
      if (grp) {
        shown = searchGroups(viewGroups(view, groups), $("q").value);
        list.set(shown, g => `<div class="lrow group" role="row" data-g="${esc(g.key)}" title="Open · double-click to play">
          ${view.type === "albums" ? (g.cover ? `<img class="thumb" src="${esc(g.cover)}" alt="">` : `<span class="thumb"></span>`) : treeIcon(view.type)}
          <span>${esc(g.name)}</span><span class="d">${esc(groupNote(g))}</span><span class="num">${g.songs.length}</span><span class="d">song${g.songs.length === 1 ? "" : "s"}</span></div>`, { keepScroll });
        $("status").textContent = `${shown.length} ${view.type.slice(0, -1)}${shown.length === 1 ? "" : "s"}`;
        ["play", "save", "rename", "del"].forEach(id => $(id).disabled = true);
        return;
      }
      shown = searchSongs(viewSongs(view, tracks, playlists, groups), $("q").value);
      if (LS.sort.key) shown = sortSongs(shown, LS.sort);
      else if (view.type === "all") shown.sort((a, b) => String(b.addedAt).localeCompare(String(a.addedAt)));
      list.set(shown, t => `<div class="lrow song${sel.has(t.id) ? " sel" : ""}" role="row" data-id="${esc(t.id)}" aria-selected="${sel.has(t.id)}">
        <span class="star${t.fav ? " on" : ""}" data-star title="${t.fav ? "Remove from favourites" : "Add to favourites"}">${t.fav ? "★" : "☆"}</span>
        <span>${esc(t.title)}</span><span class="d">${esc(t.artist || "")}</span><span class="d">${esc(t.album || "")}</span><span class="d">${esc(t.genre || "")}</span>
        <span class="d" title="${t.blob ? "Copied into this browser" : "Plays from your linked folder"}">${ext(t.mime)}${t.blob ? "" : " ↗"}</span><span class="num">${t.blob ? mb(t.blob.size) : t.size ? mb(t.size) : ""}</span><span class="num">${esc(day(t.addedAt))}</span></div>`, { keepScroll });
      $("del").textContent = view.type === "pl" ? "Remove" : "Delete";
      syncSel();
    }
    // selection updates the rows in place, so a double-click lands on the same row twice
    function syncSel() {
      document.querySelectorAll("#rows .lrow.song").forEach(r => { const on = sel.has(r.dataset.id); r.classList.toggle("sel", on); r.setAttribute("aria-selected", String(on)); });
      const bytes = shown.reduce((n, t) => n + (t.blob ? t.blob.size : 0), 0);
      const linked = shown.filter(t => !t.blob && t.link).length;
      $("status").textContent = sel.size ? `${sel.size} selected` : `${shown.length} ${shown.length === 1 ? "song" : "songs"} · ${mb(bytes)} in this browser${linked ? ` · ${linked} from your linked folder (↗)` : ""}`;
      const n = sel.size; $("play").disabled = !n; $("save").disabled = n !== 1; $("rename").disabled = !n; $("del").disabled = !n;
      $("selAll").hidden = isGroupView(view) || view.type === "notes"; $("selAll").textContent = n && shown.length && shown.every(t => sel.has(t.id)) ? "Select none" : "Select all";
    }
    const setView = v => { view = v; LS.save({ view: v }); sel.clear(); anchor = null; $("q").value = ""; showPlace(); render(false); };

    // ---------- Computer: folders on this computer, in the file manager (fm.js) ----------
    let places = [];
    const placeIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
    function placesHTML() {
      if (!("showDirectoryPicker" in window)) return `<span class="head lbl">Computer</span><p class="hint" style="padding:4px 10px;font-size:11px">Browsing folders needs Chrome, Edge or the Neon OS desktop app (in Brave, turn on File System Access in brave://flags).</p>`;
      return `<span class="head lbl">Computer</span>${places.map(p => `<button class="fold place" data-place="${esc(p.id)}" aria-current="${view.type === "place" && view.id === p.id}" title="${esc(p.name)}${p.from ? ` (linked in ${p.from})` : ""}">${placeIcon}<span class="name">${esc(p.name)}</span></button>`).join("")}<button class="fold" data-linkplace>${treeIcon("songs")}<span class="name">Link a folder…</span></button>`;
    }
    const FMKEY = "neon-os:files-fm"; let fmState = {}; try { fmState = JSON.parse(localStorage.getItem(FMKEY) || "{}"); } catch (e) {}
    const send = m => parent !== window && parent.postMessage(m, location.origin);
    const fm = mountFM($("fmMain"), {
      state: fmState, onState: st => { fmState = { ...fmState, ...st }; try { localStorage.setItem(FMKEY, JSON.stringify(fmState)); } catch (e) {} if (st.place) { view = { type: "place", id: st.place, path: st.path }; LS.save({ view }); } },
      openFiles: files => send({ neonOs: "open-files", files }),
      toNotes: (name, text) => { const nb = loadNotebook(), id = "n" + Date.now().toString(36); nb.notes.push({ id, text: text.startsWith(name) ? text : name.replace(/\.[^.]+$/, "") + "\n" + text, folder: "", updated: Date.now() }); nb.cur = id; saveNotebook(nb); send({ neonOs: "open", app: "notes" }); toast(`${name} is in Notes`); },
      toPhotos: async f => { const { addPic } = await import("../../core/photos.js"); await addPic(f); send({ neonOs: "open", app: "photos" }); toast(`${f.name} added to Photos`); },
      toBrowser: url => send({ neonOs: "open-url", url }),
      saveAs: async (blob, name) => { const { saveAs } = await import("../../core/picker.js"); await saveAs(blob, name); },
    });
    async function showPlace() {
      const on = view.type === "place"; $("fmMain").hidden = !on; $("libMain").hidden = on;
      if (!on) return;
      const p = places.find(x => x.id === view.id); if (!p) { view = { type: "all" }; $("fmMain").hidden = true; $("libMain").hidden = false; return; }
      if (!fm.place || fm.place.id !== p.id) await fm.open(p, view.path || []);
    }
    async function loadPlaces() { places = await listPlaces().catch(() => []); render(true); showPlace(); }
    wireSortHead($("head"), LS, s => { LS.save({ sort: s }); render(true); });

    $("tree").addEventListener("click", e => {
      if (e.target.closest("[data-notes]")) { setView({ type: "notes" }); return; }
      const pl = e.target.closest("[data-place]"); if (pl) { if (fm.place && fm.place.id === pl.dataset.place && view.type === "place") return; view = { type: "place", id: pl.dataset.place, path: [] }; LS.save({ view }); render(true); showPlace(); fm.place && fm.place.id !== pl.dataset.place && fm.open(places.find(x => x.id === pl.dataset.place)); return; }
      if (e.target.closest("[data-linkplace]")) { linkPlace().then(p => { if (p) { view = { type: "place", id: p.id, path: [] }; LS.save({ view }); loadPlaces(); } }); return; }
      const v = treeClick(e); if (v) setView(v);
    });
    $("back").addEventListener("click", () => setView(parentView(view)));
    $("q").addEventListener("input", () => { sel.clear(); render(false); });
    $("list").addEventListener("click", async e => {
      const g = e.target.closest(".lrow.group"); if (g) { setView(openGroup(view, g.dataset.g)); return; }
      const r = e.target.closest(".lrow.song"); if (!r) return;
      if (e.target.closest("[data-star]")) { await toggleFav(r.dataset.id); return; }
      const id = r.dataset.id, ids = shown.map(t => t.id);
      if (e.shiftKey && anchor) { const a = ids.indexOf(anchor), b = ids.indexOf(id); sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1)); }
      else if (e.ctrlKey || e.metaKey) { sel.has(id) ? sel.delete(id) : sel.add(id); anchor = id; }
      else { sel = new Set([id]); anchor = id; }
      syncSel();
    });
    $("list").addEventListener("dblclick", e => {
      if (e.target.closest("[data-star]")) return;
      const g = e.target.closest(".lrow.group");
      if (g) { const grp = shown.find(x => x.key === g.dataset.g); if (grp) playIds(viewSongs(openGroup(view, grp.key), tracks, playlists, groups).map(t => t.id), true); return; }
      const r = e.target.closest(".lrow.song"); if (r) playIds([r.dataset.id]);
    });
    $("list").addEventListener("keydown", e => {
      if (isGroupView(view) || view.type === "notes") return;
      const ids = shown.map(t => t.id); if (!ids.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const i = Math.max(0, Math.min(ids.length - 1, ids.indexOf(anchor) + (e.key === "ArrowDown" ? 1 : -1)));
        sel = new Set([ids[i]]); anchor = ids[i]; list.ensureVisible(i); syncSel(); e.preventDefault();
      }
      if (e.key === "Enter" && sel.size) playIds([...sel]);
      if (e.key === "Delete" && sel.size) remove();
      if ((e.key === "a" || e.key === "A") && (e.ctrlKey || e.metaKey)) { sel = new Set(ids); syncSel(); list.draw(); e.preventDefault(); }
    });
    async function toggleFav(id) {
      const t = byId(id); if (!t) return;
      try { const db = await openDb(); const { coverUrl, ...rec } = t; void coverUrl; await put(db, "tracks", { ...rec, fav: !t.fav }); db.close(); t.fav = !t.fav; notifyLibraryChange("edit"); render(true); }
      catch (e) { toast("Couldn't change that favourite. Try again.", true); }
    }

    // Play goes to Amp through the desktop; opened on its own, Files says so instead.
    function playIds(ids, inOrder) {
      const order = inOrder ? ids : shown.map(t => t.id).filter(id => ids.includes(id));
      if (window.parent !== window) parent.postMessage({ neonOs: "play", ids: order }, location.origin);
      else toast("Open Files from the Neon OS desktop to play songs in Amp.");
    }
    $("play").addEventListener("click", () => playIds([...sel]));
    $("save").addEventListener("click", async () => {
      let blob, name;
      if (view.type === "notes") { blob = new Blob([notebookText(loadNotebook())], { type: "text/plain" }); name = "notes.txt"; }
      else {
        const t = byId([...sel][0]); if (!t) return;
        try { blob = await fileOf(t, true); } catch (e) { toast(e.code === "needs_permission" ? "Neon OS needs permission to read your music folder. Try again and choose Allow." : `Couldn't find ${t.title} in your linked folder.`, true); return; }
        name = `${[t.artist, t.title].filter(Boolean).join(" - ").replace(/[\\/:*?"<>|]+/g, "")}.${ext(t.mime).toLowerCase()}`;
      }
      const { saveAs } = await import("../../core/picker.js"); await saveAs(blob, name);
    });
    // details, cover art and tidying names (core/details.js)
    async function saveDetails(t, patch) {
      const db = await openDb(); const { coverUrl, ...rec } = t; void coverUrl;
      Object.assign(rec, patch); await put(db, "tracks", rec); db.close(); Object.assign(t, patch);
    }
    async function edit() {
      const ts = [...sel].map(byId).filter(Boolean); if (!ts.length) return;
      try { const n = await editDetails(ts, { all: tracks, save: saveDetails }); if (n) { notifyLibraryChange("edit"); await load(); toast(n === 1 ? "Details saved" : `Saved ${n} songs`); } }
      catch (e) { toast("Couldn't save those details. Try again.", true); }
    }
    $("rename").addEventListener("click", edit);
    $("tidy").addEventListener("click", async () => {
      try { const n = await tidyNames(tracks, { save: saveDetails, kind: { artists: "artist", albums: "album", genres: "genre" }[view.type] || "artist" }); if (n) { notifyLibraryChange("edit"); await load(); } }
      catch (e) { toast("Couldn't change those names. Try again.", true); }
    });
    addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "i" && !e.target.closest("input, .dialog") && sel.size) { e.preventDefault(); edit(); } });
    async function remove() {
      const pl = view.type === "pl" ? playlists.find(p => p.id === view.id) : null, ids = [...sel];
      const what = ids.length === 1 ? byId(ids[0]).title : ids.length.toLocaleString() + " songs";
      let how = "pl";
      if (pl) { if (!(await dialog({ title: "Remove from playlist", text: `Remove ${what} from ${pl.name}? They stay in your library.`, confirm: "Remove" }))) return; }
      else {
        const { choose } = await import("../../style-kit/ui.js");
        how = await choose({ title: `Delete ${what}`, text: "Out of your library and playlists (files in linked folders stay on your computer). The Bin keeps them for 30 days; deleting for good frees their space now.",
          options: [{ label: "Cancel", value: null }, { label: "Move to the Bin", value: "bin" }, { label: "Delete for good", value: "gone", danger: true }] });
        if (!how) return;
      }
      try {
        const db = await openDb();
        if (pl) await put(db, "playlists", { ...pl, tracks: pl.tracks.filter(id => !ids.includes(id)) });
        else {
          const gone = new Set(ids);
          if (how === "bin") { // the Bin keeps each song and the playlists it was in, to put it back
            const { binPutMany } = await import("../../core/bin.js");
            for (let i = 0; i < ids.length; i += 200) await binPutMany(ids.slice(i, i + 200).map(byId).filter(Boolean).map(t => { const { coverUrl, ...rec } = t; void coverUrl; return { kind: "song", title: t.title, data: { track: rec, playlists: playlists.filter(p => p.tracks.includes(t.id)).map(p => p.id) }, sub: [t.artist, t.album].filter(Boolean).join(" · ") }; }));
          }
          for (const p of playlists.filter(p => p.tracks.some(id => gone.has(id)))) await put(db, "playlists", { ...p, tracks: p.tracks.filter(id => !gone.has(id)) });
          for (const id of ids) await del(db, "tracks", id);
        }
        db.close(); sel.clear(); notifyLibraryChange(pl ? "edit" : "delete"); await load();
        if (!pl) toast(how === "bin" ? `${what} moved to the Bin` : `${what} deleted`);
      } catch (e) { toast("Couldn't change the library. Try again.", true); }
    }
    $("del").addEventListener("click", remove);
    $("selAll").addEventListener("click", () => { const all = shown.length && shown.every(t => sel.has(t.id)); sel = all ? new Set() : new Set(shown.map(t => t.id)); syncSel(); list.draw(); $("list").focus(); });

    let reloadT = null;
    const soon = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 400); }; // a burst of changes reloads once
    onLibraryChange(soon);
    addEventListener("focus", soon);
    addEventListener("storage", e => { if (e.key === "neon-os:notebook" && view.type === "notes") render(true); });
    load(); loadPlaces();
    $("tree").addEventListener("contextmenu", e => {
      const pl = e.target.closest("[data-place]"); if (!pl) return; e.preventDefault();
      const p = places.find(x => x.id === pl.dataset.place); if (!p) return;
      import("../../style-kit/ui.js").then(({ openMenu }) => openMenu(null, p.from ? [{ note: `Linked in ${p.from}. Unlink it there.` }] : [{ text: "Unlink this folder", run: async () => { await unlinkPlace(p.id); if (view.type === "place" && view.id === p.id) { view = { type: "all" }; LS.save({ view }); } loadPlaces(); } }, { note: "The folder stays on your computer." }], { x: e.clientX, y: e.clientY }));
    });
  </script>
</body>
</html>
