<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos · Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="../../style-kit/tokens.css">
<link rel="stylesheet" href="../../style-kit/base.css">
<link rel="stylesheet" href="../../style-kit/chrome.css">
<link rel="stylesheet" href="../../style-kit/apps.css">
<style>
  body.app { padding: 10px; gap: 8px; }
  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar .slider { width: 110px; }
  .bar .lcd { font-size: 18px; line-height: 24px; padding: 0 8px; min-width: 52px; text-align: center; }
  .bar .count { margin-left: auto; }
  .bar .prog { font-size: 11.5px; color: var(--ink-faint); }
  .grid { flex: 1; min-height: 0; overflow: auto; position: relative; background: #000; border-radius: 2px; box-shadow: inset -1px -1px 0 #3a3450; contain: strict; }
  .grid .sizer { position: absolute; left: 0; top: 0; width: 1px; }
  .pic { position: absolute; border-radius: 2px; overflow: hidden; background: #0d0b14; border: 1px solid transparent; padding: 0; cursor: zoom-in; contain: strict; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .2s; }
  .pic img.ok { opacity: 1; }
  .pic:hover, .pic:focus-visible { border-color: var(--ball); outline: none; box-shadow: 0 0 10px var(--ball-dim); }
  .pic .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font-size: 10.5px; text-align: left; background: linear-gradient(transparent, #000c); color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
  .pic:hover .nm, .pic:focus-visible .nm { opacity: 1; }
  .warn { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--ball); border-radius: 2px; font-size: 12px; }
  .warn[hidden] { display: none; }
  .viewer { position: fixed; inset: 0; z-index: 20; background: #050409f2; display: grid; grid-template-rows: auto 1fr auto; }
  .viewer[hidden] { display: none; }
  .viewer .top, .viewer .bottom { display: flex; align-items: center; gap: 6px; padding: 8px 10px; flex-wrap: wrap; }
  .viewer .top strong { font-size: 13px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer .stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .viewer .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .35s; } /* the whole picture, however big the window */
  .viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); min-width: 40px; min-height: 64px; font-size: 22px; }
  .viewer .nav.l { left: 8px; } .viewer .nav.r { right: 8px; }
  .viewer .bottom .lcd { font-size: 18px; line-height: 24px; padding: 0 8px; }
  .viewer .bottom .spacer { flex: 1; }
  #empty { flex: 1; }
  /* the editor (editor.js) */
  .editor { position: fixed; inset: 0; z-index: 25; background: #07050c; display: grid; grid-template-rows: auto 1fr; }
  .ed-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #000; box-shadow: 0 1px 0 #3a3450; }
  .ed-top strong { font-size: 13px; margin-right: 8px; max-width: 30%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-top .ed-sp { flex: 1; }
  .ed-main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; min-height: 0; }
  .ed-stage { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; background: repeating-conic-gradient(#0c0a12 0 25%, #100d18 0 50%) 0 0 / 24px 24px; }
  .ed-cv { display: block; box-shadow: 0 0 0 1px #000, 0 10px 40px #000a; }
  .ed-busy { position: absolute; color: var(--ink-faint); font-size: 12px; }
  .ed-crop { position: absolute; border: 1px solid var(--ball); box-shadow: 0 0 0 9999px #000a, 0 0 12px var(--ball-dim); cursor: move; touch-action: none;
    background-image: linear-gradient(#ffffff30, #ffffff30), linear-gradient(#ffffff30, #ffffff30), linear-gradient(#ffffff30, #ffffff30), linear-gradient(#ffffff30, #ffffff30);
    background-size: 1px 100%, 1px 100%, 100% 1px, 100% 1px; background-position: 33.33% 0, 66.66% 0, 0 33.33%, 0 66.66%; background-repeat: no-repeat; }
  .ed-crop i { position: absolute; width: 14px; height: 14px; background: var(--ball); border: 2px solid #000; border-radius: 2px; }
  .ed-crop i[data-h="nw"] { left: -7px; top: -7px; cursor: nwse-resize; } .ed-crop i[data-h="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
  .ed-crop i[data-h="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; } .ed-crop i[data-h="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .ed-crop i[data-h="n"] { left: calc(50% - 7px); top: -7px; cursor: ns-resize; } .ed-crop i[data-h="s"] { left: calc(50% - 7px); bottom: -7px; cursor: ns-resize; }
  .ed-crop i[data-h="w"] { top: calc(50% - 7px); left: -7px; cursor: ew-resize; } .ed-crop i[data-h="e"] { top: calc(50% - 7px); right: -7px; cursor: ew-resize; }
  .ed-side { border-left: 1px solid #000; box-shadow: inset 1px 0 0 #3a3450; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .ed-side section { display: grid; gap: 8px; }
  .ed-side section[hidden] { display: none; }
  .ed-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .ed-chips .btn[aria-pressed="true"], .ed-f[aria-pressed="true"] span { color: var(--ball); text-shadow: 0 0 6px var(--ball-dim); }
  .ed-row { display: flex; align-items: center; gap: 8px; }
  .ed-row .lbl { width: 86px; flex: none; }
  .ed-row .slider { flex: 1; }
  .ed-row .pct { min-width: 56px; text-align: right; font-size: 17px; line-height: 20px; padding: 0 6px; }
  .ed-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ed-f { display: grid; gap: 4px; padding: 4px; border-radius: 2px; background: #000; border: 1px solid transparent; font-size: 11px; color: var(--ink-dim); }
  .ed-f canvas { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 2px; background: #111; }
  .ed-f[aria-pressed="true"] { border-color: var(--ball); box-shadow: 0 0 8px var(--ball-dim); }
  @media (max-width: 700px) { .ed-main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; } .ed-side { max-height: 45vh; border-left: 0; border-top: 1px solid #000; } }
  .drop { outline: 2px dashed var(--ball); outline-offset: -6px; }
</style>
</head>
<body class="app">
  <div class="bar">
    <select id="src" aria-label="Show pictures from"></select>
    <select id="sort" aria-label="Sort by"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name</option></select>
    <span class="lbl">Size</span><div class="slider h" id="size"></div><span class="lcd" id="sizePct">100%</span>
    <button class="btn" id="add">Add pictures</button>
    <button class="btn" id="link">Link a folder</button>
    <button class="btn" id="unlink" hidden>Unlink folder</button>
    <button class="btn" id="show" title="Play every picture shown, one after another">Slideshow</button>
    <span class="prog" id="prog" aria-live="polite"></span>
    <span class="lcd count" id="count">0</span>
  </div>
  <div class="warn" id="warn" hidden><span id="warnTxt"></span><button class="btn mini" id="reconnect">Reconnect</button></div>
  <div class="grid" id="grid" role="list" aria-label="Pictures"><div class="sizer" id="sizer"></div></div>
  <p class="empty" id="empty" hidden></p>

  <div class="viewer" id="viewer" hidden role="dialog" aria-label="Picture">
    <div class="top"><strong id="vName"></strong><span class="lcd" id="vPos" style="font-size:18px;line-height:24px;padding:0 8px"></span><button class="btn" id="vClose" aria-label="Close">✕</button></div>
    <div class="stage"><img id="vImg" alt=""><button class="btn nav l" id="vPrev" aria-label="Previous picture">‹</button><button class="btn nav r" id="vNext" aria-label="Next picture">›</button></div>
    <div class="bottom">
      <button class="btn" id="vPlay" aria-pressed="false"><i class="led"></i>Slideshow</button>
      <span class="lbl">Every</span><select id="speed" aria-label="Seconds per picture"><option value="3">3 seconds</option><option value="5">5 seconds</option><option value="8">8 seconds</option><option value="15">15 seconds</option></select>
      <span class="spacer"></span>
      <button class="btn" id="vEdit" title="Crop, turn, light, colour and filters">Edit</button>
      <button class="btn" id="vWall">Set as wallpaper</button>
      <button class="btn" id="vDel" style="color:var(--danger)">Remove</button>
    </div>
  </div>
  <script type="module">
    import "../../core/os-link.js";
    import { applyTheme, onTheme, setTheme } from "../../core/theme.js";
    import { esc, toast, dialog, Slider } from "../../style-kit/ui.js";
    import { listPics, addPic, putPic, removePic, listPicFolders, addPicFolder, removePicFolder, folderAccess, scanPicFolder, fileAt, getFolderIndex, setFolderIndex, allThumbs, putThumb, dropThumbs, IMAGE_EXT } from "../../core/photos.js";
    import { setWallImage } from "../../core/desk.js";
    import { binPut, onBinChange } from "../../core/bin.js";
    import { notify } from "../../core/notify.js";
    import { pickFiles } from "../../core/picker.js";
    import { openEditor } from "./editor.js";
    applyTheme(); onTheme(applyTheme);
    const $ = id => document.getElementById(id), KEY = "neon-os:photos";
    let S = { src: "all", sort: "new", size: 1, speed: 5 };
    try { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
    const canLink = "showDirectoryPicker" in window;
    const prog = t => { $("prog").textContent = t || ""; };

    // every picture: { id, name, modified, kind: "added" | "folder", blob? (added) | folder + path (linked) }
    let pics = [], folders = [], locked = [], shown = [];
    const byFolder = new Map();
    async function blobOf(p) { if (p.blob) return p.blob; return await fileAt(byFolder.get(p.folder), p.path); }
    // the full picture, for the viewer: only a few kept at once
    const full = new Map();
    async function fullUrl(p) {
      if (full.has(p.id)) { const u = full.get(p.id); full.delete(p.id); full.set(p.id, u); return u; }
      const u = URL.createObjectURL(await blobOf(p)); full.set(p.id, u);
      while (full.size > 6) { const [k, old] = full.entries().next().value; URL.revokeObjectURL(old); full.delete(k); }
      return u;
    }

    // ---------- previews: made once in background workers, kept in the browser, drawn only when on screen ----------
    const TH = 320, tkey = p => `${p.id}|${p.modified || 0}`;
    let thumbs = new Map();            // key -> preview blob (kept)
    const turls = new Map();           // key -> object URL, at most ~600 at a time
    const failed = new Set();          // keys the worker couldn't do: shown from the original
    function thumbUrl(k) {
      if (turls.has(k)) { const u = turls.get(k); turls.delete(k); turls.set(k, u); return u; }
      const b = thumbs.get(k); if (!b) return null;
      const u = URL.createObjectURL(b); turls.set(k, u);
      while (turls.size > 600) { const [old, ou] = turls.entries().next().value; if (cells.has(old)) break; URL.revokeObjectURL(ou); turls.delete(old); }
      return u;
    }
    const workers = [], busy = new Set(), queue = new Map(); let wanted = new Set(), made = 0;
    const NW = Math.max(1, Math.min(3, Math.floor((navigator.hardwareConcurrency || 2) / 2)));
    function worker(i) {
      if (!workers[i]) {
        const w = new Worker(new URL("../../core/thumb-worker.js", location.href)); w.job = null;
        w.onmessage = async e => {
          const { key, blob } = e.data; busy.delete(key); w.job = null;
          if (blob) { thumbs.set(key, blob); putThumb(key, blob); made++; } else failed.add(key);
          paintKey(key); pump();
        };
        workers[i] = w;
      }
      return workers[i];
    }
    function want(list) { // the pictures on screen (and just past it) come first; others wait until they scroll in
      wanted = new Set(list.map(tkey));
      for (const k of [...queue.keys()]) if (!wanted.has(k)) queue.delete(k);
      for (const p of list) { const k = tkey(p); if (!thumbs.has(k) && !failed.has(k) && !busy.has(k) && !queue.has(k)) queue.set(k, p); }
      pump();
    }
    let bgAt = 0; // with nothing on screen waiting, the workers carry on through the rest so scrolling later is instant
    function nextBackground() {
      while (bgAt < shown.length) { const p = shown[bgAt++], k = tkey(p); if (!thumbs.has(k) && !failed.has(k) && !busy.has(k)) return [k, p]; }
      return null;
    }
    async function pump() {
      if (!queue.size && !document.hidden) { const n = nextBackground(); if (n) queue.set(n[0], n[1]); }
      for (let i = 0; i < NW && queue.size; i++) {
        const w = worker(i); if (w.job) continue;
        const [k, p] = queue.entries().next().value; queue.delete(k); busy.add(k); w.job = k;
        try { const blob = await blobOf(p); w.postMessage({ key: k, blob, size: TH }); } catch (e) { busy.delete(k); w.job = null; failed.add(k); paintKey(k); }
      }
      const todo = shown.filter(p => !thumbs.has(tkey(p)) && !failed.has(tkey(p))).length;
      prog(todo && (queue.size || busy.size) ? `Making previews… ${todo.toLocaleString()} to go` : "");
      if (!queue.size && busy.size < NW && bgAt < shown.length) setTimeout(pump, 0);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pump(); });

    // ---------- loading: added pictures, then linked folders from their remembered lists, then a fresh look ----------
    async function folderPics(f, entries) { return entries.map(e => ({ id: f.id + ":" + e.path, name: e.name, path: e.path, folder: f.id, modified: e.modified, size: e.size, kind: "folder" })); }
    async function rescan(f, known) {
      const found = await scanPicFolder(f), have = new Map((known || []).map(e => [e.path, e]));
      const fresh = found.filter(x => !have.has(x.path)); let n = 0;
      for (let i = 0; i < fresh.length; i += 100) {
        await Promise.all(fresh.slice(i, i + 100).map(async x => { try { const file = await x.handle.getFile(); x.modified = file.lastModified; x.size = file.size; } catch (e) { x.modified = 0; } }));
        n += Math.min(100, fresh.length - i); if (fresh.length > 300) prog(`Reading ${f.name}… ${n.toLocaleString()} of ${fresh.length.toLocaleString()}`);
      }
      const entries = found.map(x => have.get(x.path) || { path: x.path, name: x.name, modified: x.modified, size: x.size });
      const changed = !known || fresh.length || entries.length !== known.length;
      if (changed) await setFolderIndex(f.id, entries);
      return { entries, changed };
    }
    let loading = 0;
    async function load() {
      const run = ++loading;
      const added = (await listPics().catch(() => [])).map(p => ({ ...p, kind: "added" }));
      folders = await listPicFolders().catch(() => []); locked = []; byFolder.clear();
      const fromFolders = [], toScan = [];
      for (const f of folders) {
        byFolder.set(f.id, f);
        if (!(await folderAccess(f))) { locked.push(f); continue; }
        const known = await getFolderIndex(f.id);
        if (known) fromFolders.push(...await folderPics(f, known));
        toScan.push([f, known]);
      }
      if (!thumbs.size) thumbs = await allThumbs().catch(() => new Map());
      pics = [...added, ...fromFolders]; drawSources(); draw();
      // then look at each folder again for pictures added or removed since
      for (const [f, known] of toScan) {
        try {
          const { entries, changed } = await rescan(f, known);
          if (run !== loading) return;
          if (changed) { pics = [...pics.filter(p => p.folder !== f.id), ...await folderPics(f, entries)]; draw(true); }
        } catch (e) { locked.push(f); drawSources(); }
      }
      prog("");
      if (!locked.length && run === loading) { // previews of pictures that are gone
        const keep = new Set(pics.map(tkey)), gone = [...thumbs.keys()].filter(k => !keep.has(k));
        if (gone.length) { gone.forEach(k => thumbs.delete(k)); dropThumbs(gone); }
      }
      pump();
    }
    function drawSources() {
      const opts = [["all", "All pictures"], ["added", "Added here"], ...folders.map(f => [f.id, "Folder: " + f.name])];
      if (!opts.some(o => o[0] === S.src)) S.src = "all";
      $("src").innerHTML = opts.map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join("");
      $("src").value = S.src;
      $("unlink").hidden = !folders.some(f => f.id === S.src);
      $("link").hidden = !canLink;
      $("warn").hidden = !locked.length;
      $("warnTxt").textContent = locked.length ? `${locked.map(f => f.name).join(", ")} need${locked.length === 1 ? "s" : ""} permission again to show ${locked.length === 1 ? "its" : "their"} pictures.` : "";
    }
    const cmp = { new: (a, b) => (b.modified || 0) - (a.modified || 0), old: (a, b) => (a.modified || 0) - (b.modified || 0), name: (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }) };

    // ---------- the grid: only the rows on screen exist; the rest is empty space of the right height ----------
    const grid = $("grid"), sizer = $("sizer"), GAP = 6, PAD = 6;
    const cells = new Map(); // key -> element on screen
    let geo = { cols: 1, cw: 140, rowH: 146 };
    function layout() {
      const W = grid.clientWidth - PAD * 2, want = 140 * S.size;
      const cols = Math.max(1, Math.floor((W + GAP) / (want + GAP))), cw = Math.max(40, (W - GAP * (cols - 1)) / cols);
      geo = { cols, cw, rowH: cw + GAP };
      sizer.style.height = Math.ceil(shown.length / cols) * geo.rowH + PAD * 2 + "px";
    }
    function paintKey(k) { const el = cells.get(k); if (el) paint(el); }
    function paint(el) {
      const p = shown[+el.dataset.i]; if (!p) return;
      const img = el.querySelector("img"), k = tkey(p);
      if (img.dataset.k === k && img.src) return;
      const u = thumbUrl(k);
      if (u) { img.dataset.k = k; img.onload = () => img.classList.add("ok"); img.src = u; }
      else if (failed.has(k)) { img.dataset.k = k; fullUrl(p).then(src => { img.onload = () => img.classList.add("ok"); img.src = src; }).catch(() => { el.querySelector(".nm").textContent = p.name + " (can't open)"; }); }
    }
    let rafId = 0;
    function render() {
      rafId = 0;
      const { cols, cw, rowH } = geo, rows = Math.ceil(shown.length / cols);
      const first = Math.max(0, Math.floor((grid.scrollTop - PAD) / rowH) - 2), last = Math.min(rows - 1, Math.ceil((grid.scrollTop + grid.clientHeight) / rowH) + 2);
      const keep = new Set();
      for (let r = first; r <= last; r++) for (let c = 0; c < cols; c++) {
        const i = r * cols + c, p = shown[i]; if (!p) break;
        const k = tkey(p); keep.add(k);
        let el = cells.get(k);
        if (!el) {
          el = document.createElement("button"); el.className = "pic"; el.setAttribute("role", "listitem"); el.title = p.name;
          el.innerHTML = `<img alt="${esc(p.name)}" decoding="async"><span class="nm">${esc(p.name)}</span>`;
          grid.appendChild(el); cells.set(k, el);
        }
        el.dataset.i = i;
        el.style.cssText = `left:${PAD + c * (cw + GAP)}px;top:${PAD + r * rowH}px;width:${cw}px;height:${cw}px`;
        paint(el);
      }
      for (const [k, el] of cells) if (!keep.has(k)) { el.remove(); cells.delete(k); }
      // previews for what's on screen, then the next few rows down
      const ahead = shown.slice(first * cols, Math.min(shown.length, (last + 6) * cols));
      want(ahead);
    }
    const schedule = () => { if (!rafId) rafId = requestAnimationFrame(render); };
    grid.addEventListener("scroll", schedule, { passive: true });
    new ResizeObserver(() => { layout(); schedule(); }).observe(grid);
    function draw(keepScroll) {
      shown = pics.filter(p => S.src === "all" || (S.src === "added" ? p.kind === "added" : p.folder === S.src)).sort(cmp[S.sort] || cmp.new);
      $("count").textContent = `${shown.length.toLocaleString()} PIC${shown.length === 1 ? "" : "S"}`;
      $("sort").value = S.sort;
      for (const el of cells.values()) el.remove(); cells.clear(); bgAt = 0;
      if (!keepScroll) grid.scrollTop = 0;
      grid.hidden = !shown.length; $("empty").hidden = !!shown.length;
      $("empty").innerHTML = pics.length ? "No pictures here." : `No pictures yet. ${canLink ? "Link a folder of pictures to see them in place (nothing is copied), or add" : "Add"} some to keep them here. You can also drop pictures on this window.`;
      layout(); render();
    }

    Slider($("size"), { min: 0.5, max: 2, step: 0.05, value: S.size, label: "Thumbnail size", text: v => Math.round(v * 100) + "%",
      onInput: v => { S.size = v; $("sizePct").textContent = Math.round(v * 100) + "%"; layout(); schedule(); }, onChange: save });
    $("sizePct").textContent = Math.round(S.size * 100) + "%";
    $("src").addEventListener("change", () => { S.src = $("src").value; save(); drawSources(); draw(); });
    $("sort").addEventListener("change", () => { S.sort = $("sort").value; save(); draw(); });
    $("add").addEventListener("click", async () => addFiles(await pickFiles({ accept: "image/*", multiple: true })));
    async function addFiles(files) {
      const imgs = [...files].filter(f => f.type.startsWith("image/") || IMAGE_EXT.test(f.name)); let n = 0;
      for (const f of imgs) { try { await addPic(f); n++; } catch (e) {} }
      if (n) { toast(n === 1 ? `Added ${imgs[0].name}` : `Added ${n} pictures`); if (S.src !== "all" && S.src !== "added") { S.src = "added"; save(); } load(); }
      else if (files.length) toast("Those aren't pictures.", true);
    }
    addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); document.body.classList.add("drop"); } });
    addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drop"); });
    addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); addFiles(e.dataTransfer.files); });
    $("link").addEventListener("click", async () => {
      let h; try { h = await showDirectoryPicker({ id: "neon-os-photos", mode: "read" }); } catch (e) { return; }
      const f = await addPicFolder(h); S.src = f.id; save(); toast(`Linked ${f.name}`); load();
    });
    $("unlink").addEventListener("click", async () => {
      const f = folders.find(x => x.id === S.src); if (!f) return;
      const ok = await dialog({ title: "Unlink folder", text: `Photos stops showing ${f.name}. The pictures stay in the folder on your computer.`, confirm: "Unlink" });
      if (!ok) return; await removePicFolder(f.id); S.src = "all"; save(); load();
    });
    $("reconnect").addEventListener("click", async () => { for (const f of locked) await folderAccess(f, true); load(); });

    // ---------- viewer and slideshow ----------
    let at = -1, timer = null;
    async function view(i) {
      if (!shown.length) return;
      at = (i + shown.length) % shown.length; const p = shown[at];
      $("viewer").hidden = false; $("vName").textContent = p.name; $("vPos").textContent = `${at + 1} / ${shown.length}`;
      $("vDel").hidden = p.kind !== "added";
      const img = $("vImg"); img.style.opacity = 0; img.alt = p.name;
      try { const u = await fullUrl(p); if (shown[at] !== p) return; img.onload = () => { img.style.opacity = 1; }; img.src = u; } catch (e) { toast("Couldn't open that picture.", true); }
      // keep the next one ready so the slideshow doesn't wait
      const n = shown[(at + 1) % shown.length]; if (n && n !== p) fullUrl(n).catch(() => {});
    }
    function closeView() { $("viewer").hidden = true; play(false); const b = grid.querySelector(`.pic[data-i="${at}"]`); if (b) b.focus(); else { grid.scrollTop = Math.floor(at / geo.cols) * geo.rowH; } }
    function play(on) {
      clearInterval(timer); timer = null; $("vPlay").setAttribute("aria-pressed", String(on));
      if (on) timer = setInterval(() => view(at + 1), S.speed * 1000);
    }
    grid.addEventListener("click", e => { const b = e.target.closest(".pic"); if (b) view(+b.dataset.i); });
    $("vPrev").addEventListener("click", () => { view(at - 1); if (timer) play(true); });
    $("vNext").addEventListener("click", () => { view(at + 1); if (timer) play(true); });
    $("vClose").addEventListener("click", closeView);
    $("vPlay").addEventListener("click", () => play(!timer));
    $("show").addEventListener("click", () => { if (!shown.length) return; view(0); play(true); });
    $("speed").value = String(S.speed);
    $("speed").addEventListener("change", () => { S.speed = +$("speed").value; save(); if (timer) play(true); });
    addEventListener("keydown", e => {
      if ($("viewer").hidden || e.target.closest("select") || document.querySelector(".editor")) return;
      if (e.key === "Escape") { e.preventDefault(); closeView(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); $("vNext").click(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); $("vPrev").click(); }
      else if (e.key === " ") { e.preventDefault(); play(!timer); }
    });
    // ---------- editing: the editor makes a new picture; where it goes is chosen when saving ----------
    async function folderDir(f, path, write) { // the folder a linked picture is in, asking to write there if needed
      if (write && await f.handle.queryPermission({ mode: "readwrite" }) !== "granted" && await f.handle.requestPermission({ mode: "readwrite" }) !== "granted") return null;
      let dir = f.handle; for (const part of path.split("/").slice(0, -1)) dir = await dir.getDirectoryHandle(part); return dir;
    }
    async function freeName(dir, name) { const m = name.match(/^(.*?)(\.[^.]+)?$/); for (let i = 1; i < 999; i++) { const n = i === 1 ? name : `${m[1]} ${i}${m[2] || ""}`; try { await dir.getFileHandle(n); } catch (e) { return n; } } return name; }
    $("vEdit").addEventListener("click", async () => {
      const p = shown[at]; if (!p) return;
      let blob; try { blob = await blobOf(p); } catch (e) { toast("Couldn't open that picture.", true); return; }
      play(false);
      await openEditor(p, {
        blob, canReplace: p.kind === "added", canSaveToFolder: p.kind === "folder",
        save: async (kind, out, name) => {
          const file = new File([out], name, { type: out.type, lastModified: Date.now() });
          if (kind === "wall") { await setWallImage(out); setTheme({ wall: "image", wallStamp: Date.now() }); return "Wallpaper changed"; }
          if (kind === "as") { const { saveAs } = await import("../../core/picker.js"); const t = await saveAs(out, name, { description: "Picture", accept: { [out.type]: ["." + name.split(".").pop()] } }); return t ? `Saved ${t.name}` : null; }
          if (kind === "replace" && p.kind === "added") {
            const { kind: k, ...rec } = p; void k;
            await binPut("photo", p.name, rec, "Photos · before editing");
            await putPic({ ...rec, blob: file, type: out.type, size: out.size, modified: Date.now() });
            await load(); return "Picture replaced. The original is in the Bin.";
          }
          if (p.kind === "folder") { // a copy beside the original, in the folder on your computer
            const f = byFolder.get(p.folder), dir = f && await folderDir(f, p.path, true).catch(() => null);
            if (dir) { const n = await freeName(dir, name), h = await dir.getFileHandle(n, { create: true }), w = await h.createWritable(); await w.write(out); await w.close(); await load(); return `Saved ${n} in ${f.name}`; }
          }
          await addPic(file); await load(); return `Saved ${name} in Photos`;
        },
      });
    });
    $("vWall").addEventListener("click", async () => {
      const p = shown[at]; if (!p) return;
      try { await setWallImage(await blobOf(p)); setTheme({ wall: "image", wallStamp: Date.now() }); if (!notify("Wallpaper changed", p.name, "photos")) toast("Wallpaper changed"); }
      catch (e) { toast("Couldn't use that picture. Try a smaller one.", true); }
    });
    $("vDel").addEventListener("click", async () => {
      const p = shown[at]; if (!p || p.kind !== "added") return;
      const { kind, ...rec } = p; void kind;
      try { await binPut("photo", p.name, rec, "Photos"); await removePic(p.id); } catch (e) { toast("Couldn't move it to the Bin.", true); return; }
      const u = full.get(p.id); if (u) { URL.revokeObjectURL(u); full.delete(p.id); }
      pics = pics.filter(x => x.id !== p.id); const keep = at; draw(true);
      if (shown.length) view(Math.min(keep, shown.length - 1)); else closeView();
      if (!notify("Picture moved to the Bin", `${p.name} can be put back for 30 days.`, "bin")) toast("Moved to the Bin");
    });
    onBinChange(() => { if ($("viewer").hidden) load(); }); // a picture put back from the Bin
    load();
  </script>
</body>
</html>
