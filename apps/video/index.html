<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video · Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="../../style-kit/tokens.css">
<link rel="stylesheet" href="../../style-kit/base.css">
<link rel="stylesheet" href="../../style-kit/chrome.css">
<link rel="stylesheet" href="../../style-kit/apps.css">
<style>
  body.app { padding: 0; gap: 0; }
  .wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .wrap.wide { grid-template-columns: 0 minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 0; border-right: 1px solid #000; box-shadow: inset -1px 0 0 #3a3450; overflow: hidden; }
  .wrap.wide .side { display: none; }
  .side .list { flex: 1; overflow: auto; align-content: start; }
  .vid { cursor: pointer; display: grid; gap: 3px; }
  .vid .bar { height: 3px; background: #ffffff14; border-radius: 2px; overflow: hidden; }
  .vid .bar i { display: block; height: 100%; background: var(--ball); }
  .vid.now strong { color: var(--ball); text-shadow: 0 0 6px var(--ball-dim); }
  .side select { width: 100%; }
  .player { position: relative; background: #000; min-height: 0; overflow: hidden; }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .player .hello { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; color: var(--ink-dim); font-size: 13px; padding: 20px; }
  .player .hello b { font: 34px/1 var(--font-lcd); color: var(--ball); text-shadow: 0 0 8px var(--ball-dim); }
  .ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; background: linear-gradient(transparent, #000d 40%); display: grid; gap: 8px; transition: opacity .25s; }
  .player.idle .ctl { opacity: 0; pointer-events: none; }
  .player.idle { cursor: none; }
  .ctl .row { flex-wrap: nowrap; }
  .ctl .seek { flex: 1; }
  .ctl .lcd { font-size: 18px; line-height: 22px; padding: 0 8px; white-space: nowrap; }
  .ctl .vol { width: 90px; }
  .ctl .btn.icon svg { width: 16px; height: 16px; fill: currentColor; }
  .ctl .sp { flex: 1; }
  .ctl .ttl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px #000; min-width: 0; }
  .ctl select { padding: 3px 6px; }
  .flash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 36px/1 var(--font-lcd); color: var(--ball); text-shadow: 0 0 10px var(--ball-dim); background: #000a; padding: 10px 16px; border-radius: 3px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .flash.on { opacity: 1; transition: none; }
  .drop { outline: 2px dashed var(--ball); outline-offset: -8px; }
  @media (max-width: 640px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .side { max-height: 30vh; border-right: 0; } .ctl .vol, .ctl #speed { display: none; } }
</style>
</head>
<body class="app">
  <div class="wrap" id="wrap">
    <div class="side">
      <div class="row"><button class="btn" id="open">Open videos</button><button class="btn" id="link" title="Show the videos in a folder on your computer, without copying them">Link a folder</button></div>
      <select id="src" aria-label="Videos from"></select>
      <div class="list" id="list" role="list"></div>
      <p class="hint" id="hint">Open videos, drop them here, or link a folder. Each one carries on from where you stopped.</p>
      <div class="row"><button class="btn mini" id="unlink" hidden>Unlink folder</button><button class="btn mini" id="reconnect" hidden>Reconnect folder</button></div>
    </div>
    <div class="player" id="player">
      <video id="v" playsinline preload="metadata"></video>
      <div class="hello" id="hello"><b>VIDEO</b><span>Open a video, or drop one here.</span></div>
      <div class="flash" id="flash"></div>
      <div class="ctl" id="ctl">
        <div class="row"><span class="ttl" id="ttl"></span><span class="sp"></span></div>
        <div class="row"><span class="lcd" id="cur">0:00</span><span class="slider h seek" id="seek"></span><span class="lcd" id="dur">0:00</span></div>
        <div class="row">
          <button class="btn icon" id="prev" aria-label="Previous video (P)" title="Previous video (P)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button class="btn icon" id="back" aria-label="Back 10 seconds (J)" title="Back 10 seconds (J)"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg></button>
          <button class="btn icon" id="play" aria-label="Play (Space)" title="Play (Space)"></button>
          <button class="btn icon" id="fwd" aria-label="Forward 10 seconds (L)" title="Forward 10 seconds (L)"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg></button>
          <button class="btn icon" id="next" aria-label="Next video (N)" title="Next video (N)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <button class="btn" id="mute" title="Mute (M)">Vol</button><span class="slider h vol" id="vol"></span><span class="lcd" id="volPct">100%</span>
          <span class="sp"></span>
          <select id="speed" aria-label="Speed" title="Speed ([ and ])"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
          <button class="btn" id="loop" aria-pressed="false" title="Play this video again and again"><i class="led"></i>Loop</button>
          <button class="btn" id="subs" title="Add subtitles (.vtt or .srt); C turns them on and off">Subtitles</button>
          <button class="btn" id="pip" title="Keep playing in a small window on top">Pop out</button>
          <button class="btn" id="list1" title="Show or hide the list">List</button>
          <button class="btn" id="fs" title="Full screen (F)">Full</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import "../../core/os-link.js";
    import { applyTheme, onTheme } from "../../core/theme.js";
    import { esc, toast, dialog, Slider } from "../../style-kit/ui.js";
    import { pickFiles } from "../../core/picker.js";
    applyTheme(); onTheme(applyTheme);
    const $ = id => document.getElementById(id), v = $("v"), KEY = "neon-os:video", POS = "neon-os:video-pos";
    let S = { vol: 1, muted: false, speed: 1, loop: false, wide: false, src: "opened" };
    try { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
    // where each video got to: key = name + size, so it carries on next time (kept for the last 300)
    let P = {}; try { P = JSON.parse(localStorage.getItem(POS) || "{}"); } catch (e) {}
    const savePos = () => { const ks = Object.keys(P); if (ks.length > 300) ks.sort((a, b) => P[a].at - P[b].at).slice(0, ks.length - 300).forEach(k => delete P[k]); try { localStorage.setItem(POS, JSON.stringify(P)); } catch (e) {} };
    const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
    const VIDEO = /\.(mp4|m4v|webm|mkv|mov|ogv|avi)$/i;
    const ICON = { play: "M8 5v14l11-7z", pause: "M6 5h4v14H6zm8 0h4v14h-4z" };

    // ---------- the list: videos opened this time, and linked folders ----------
    // an item: { id, name, size, file? | url? | folder + handle }
    let opened = [], folders = [], items = [], curId = null, curUrl = null;
    const DB = "neon-os-video";
    const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore("folders", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    async function tx(mode, fn) { const db = await idb(); try { return await new Promise((res, rej) => { const t = db.transaction("folders", mode), q = fn(t.objectStore("folders")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); } finally { db.close(); } }
    const keyOf = it => `${it.name}|${it.size || 0}`;
    async function loadFolders() { folders = await tx("readonly", s => s.getAll()).catch(() => []) || []; drawSources(); }
    function drawSources() {
      const opts = [["opened", "Opened this time"], ...folders.map(f => [f.id, "Folder: " + f.name])];
      if (!opts.some(o => o[0] === S.src)) S.src = "opened";
      $("src").innerHTML = opts.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join(""); $("src").value = S.src;
      $("unlink").hidden = S.src === "opened"; $("link").hidden = !("showDirectoryPicker" in window);
    }
    async function listFolder(f, ask) {
      let ok = false; try { ok = await f.handle.queryPermission({ mode: "read" }) === "granted" || (ask && await f.handle.requestPermission({ mode: "read" }) === "granted"); } catch (e) {}
      $("reconnect").hidden = ok; if (!ok) return [];
      const out = [];
      async function walk(dir, path, depth) { for await (const [name, h] of dir.entries()) { if (h.kind === "file" && VIDEO.test(name)) out.push({ id: f.id + ":" + path + name, name, handle: h, folder: f.id }); else if (h.kind === "directory" && depth < 5 && !name.startsWith(".")) await walk(h, path + name + "/", depth + 1); } }
      await walk(f.handle, "", 0);
      await Promise.all(out.map(async it => { try { it.size = (await it.handle.getFile()).size; } catch (e) {} }));
      return out.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    }
    async function refresh(ask) {
      if (S.src === "opened") { items = opened; $("reconnect").hidden = true; }
      else { const f = folders.find(x => x.id === S.src); items = f ? await listFolder(f, ask) : []; }
      drawList();
    }
    function drawList() {
      $("list").innerHTML = items.map(it => { const p = P[keyOf(it)], frac = p && p.d ? Math.min(1, p.t / p.d) : 0;
        return `<div class="item vid${it.id === curId ? " now" : ""}" role="listitem" data-id="${esc(it.id)}" title="${esc(it.name)}"><strong>${esc(it.name)}</strong><small>${p && p.d ? (frac > 0.97 ? "Watched · " : p.t > 5 ? `Stopped at ${fmt(p.t)} · ` : "") + fmt(p.d) : it.size ? (it.size >= 1e9 ? (it.size / 1e9).toFixed(1) + " GB" : it.size >= 1e6 ? Math.round(it.size / 1e6) + " MB" : Math.max(1, Math.round(it.size / 1e3)) + " KB") : ""}</small>${frac > 0.01 && frac <= 0.97 ? `<span class="bar"><i style="width:${frac * 100}%"></i></span>` : ""}</div>`; }).join("");
      $("hint").hidden = !!items.length;
    }
    $("src").addEventListener("change", () => { S.src = $("src").value; save(); drawSources(); refresh(false); });
    $("list").addEventListener("click", e => { const it = e.target.closest("[data-id]"); if (it) play(items.find(x => x.id === it.dataset.id)); });
    $("reconnect").addEventListener("click", () => refresh(true));
    $("link").addEventListener("click", async () => {
      let h; try { h = await showDirectoryPicker({ id: "neon-os-video", mode: "read" }); } catch (e) { return; }
      for (const f of folders) { try { if (await f.handle.isSameEntry(h)) { S.src = f.id; save(); drawSources(); refresh(false); return; } } catch (e) {} }
      const f = { id: "f" + Date.now().toString(36), name: h.name, handle: h }; await tx("readwrite", s => s.put(f));
      S.src = f.id; save(); await loadFolders(); refresh(false);
    });
    $("unlink").addEventListener("click", async () => {
      const f = folders.find(x => x.id === S.src); if (!f) return;
      if (!(await dialog({ title: "Unlink folder", text: `Video stops showing ${f.name}. The videos stay in the folder on your computer.`, confirm: "Unlink" }))) return;
      await tx("readwrite", s => s.delete(f.id)); S.src = "opened"; save(); await loadFolders(); refresh(false);
    });
    function addOpened(list, autoplay = true) {
      const add = list.filter(f => f && (f.url || (f.type || "").startsWith("video/") || VIDEO.test(f.name || "")));
      if (!add.length) { if (list.length) toast("Those aren't videos Neon OS can play.", true); return; }
      const made = add.map(f => ({ id: "o" + Math.random().toString(36).slice(2, 9), name: f.name, size: f.size || 0, file: f.url ? null : f, url: f.url || null }));
      opened = [...opened, ...made]; S.src = "opened"; save(); drawSources(); items = opened; drawList();
      if (autoplay) play(made[0]);
    }
    $("open").addEventListener("click", async () => addOpened(await pickFiles({ accept: "video/*,.mkv,.mov,.m4v,.ogv", multiple: true })));
    addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); document.body.classList.add("drop"); } });
    addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drop"); });
    addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); addOpened([...e.dataTransfer.files]); });
    // videos opened from the computer reach here from the desktop (os/shell.js)
    addEventListener("message", e => { if (e.origin === location.origin && e.data && Array.isArray(e.data.neonOsVideos)) addOpened(e.data.neonOsVideos); });

    // ---------- playing ----------
    let cur = null;
    async function play(it) {
      if (!it) return;
      remember();
      let src;
      try { src = it.url || URL.createObjectURL(it.file || await it.handle.getFile()); } catch (e) { toast("Couldn't open that video. If it's in a linked folder, press Reconnect folder.", true); return; }
      if (curUrl && curUrl.startsWith("blob:")) URL.revokeObjectURL(curUrl);
      curUrl = src; cur = it; curId = it.id;
      [...v.querySelectorAll("track")].forEach(t => t.remove());
      v.src = src; $("ttl").textContent = it.name; $("hello").hidden = true; document.title = it.name + " · Video";
      const p = P[keyOf(it)];
      v.addEventListener("loadedmetadata", () => { if (p && p.t > 5 && p.t < v.duration - 10) { v.currentTime = p.t; flash(`FROM ${fmt(p.t)}`); } }, { once: true });
      v.play().catch(() => {}); drawList();
      parent !== window && parent.postMessage({ neonOs: "pause-music" }, location.origin); // Amp pauses while a video plays
    }
    function remember() { if (!cur || !v.duration || !isFinite(v.duration)) return; P[keyOf(cur)] = { t: v.currentTime, d: v.duration, at: Date.now() }; savePos(); }
    setInterval(() => { if (!v.paused) remember(); }, 5000);
    v.addEventListener("pause", () => { remember(); drawList(); });
    v.addEventListener("ended", () => { remember(); drawList(); if (!S.loop) step(1, true); });
    const step = (d, auto) => { const i = items.findIndex(x => x.id === curId); const n = items[i + d]; if (n) play(n); else if (!auto) flash(d > 0 ? "LAST VIDEO" : "FIRST VIDEO"); };
    const toggle = () => { if (!v.src) { $("open").click(); return; } v.paused ? v.play().catch(() => {}) : v.pause(); };
    const syncPlay = () => { $("play").innerHTML = `<svg viewBox="0 0 24 24"><path d="${v.paused ? ICON.play : ICON.pause}"/></svg>`; $("play").setAttribute("aria-label", v.paused ? "Play (Space)" : "Pause (Space)"); };
    v.addEventListener("play", () => { syncPlay(); parent !== window && parent.postMessage({ neonOs: "pause-music" }, location.origin); }); v.addEventListener("pause", syncPlay); syncPlay();
    v.addEventListener("error", () => { if (v.src) toast("This video's format can't be played here. MP4 (H.264) and WebM play everywhere.", true); });
    let flashT = 0; function flash(t) { const f = $("flash"); f.textContent = t; f.classList.add("on"); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove("on"), 600); }

    // ---------- controls ----------
    let dragging = false;
    const seek = Slider($("seek"), { min: 0, max: 1, step: 0.001, value: 0, label: "Position", text: x => fmt(x * (v.duration || 0)),
      onInput: x => { dragging = true; if (v.duration) { v.currentTime = x * v.duration; $("cur").textContent = fmt(v.currentTime); } }, onChange: () => { dragging = false; } });
    v.addEventListener("timeupdate", () => { if (!dragging && v.duration) seek.set(v.currentTime / v.duration); $("cur").textContent = fmt(v.currentTime); });
    v.addEventListener("durationchange", () => { $("dur").textContent = fmt(v.duration); });
    const vol = Slider($("vol"), { min: 0, max: 1, step: 0.01, value: S.vol, label: "Volume", text: x => Math.round(x * 100) + "%", onInput: x => { S.vol = x; S.muted = false; applyVol(); }, onChange: save });
    function applyVol() { v.volume = S.vol; v.muted = S.muted; $("volPct").textContent = S.muted ? "MUTE" : Math.round(S.vol * 100) + "%"; $("mute").setAttribute("aria-pressed", String(S.muted)); }
    $("mute").addEventListener("click", () => { S.muted = !S.muted; applyVol(); save(); });
    $("speed").value = String(S.speed); v.playbackRate = S.speed;
    $("speed").addEventListener("change", () => { S.speed = +$("speed").value; v.playbackRate = S.speed; save(); });
    v.addEventListener("loadedmetadata", () => { v.playbackRate = S.speed; });
    const syncLoop = () => { v.loop = S.loop; $("loop").setAttribute("aria-pressed", String(S.loop)); };
    $("loop").addEventListener("click", () => { S.loop = !S.loop; syncLoop(); save(); }); syncLoop();
    $("play").addEventListener("click", toggle); v.addEventListener("click", toggle); v.addEventListener("dblclick", () => fullscreen());
    $("back").addEventListener("click", () => { v.currentTime = Math.max(0, v.currentTime - 10); flash("−10 S"); });
    $("fwd").addEventListener("click", () => { v.currentTime = Math.min(v.duration || 0, v.currentTime + 10); flash("+10 S"); });
    $("prev").addEventListener("click", () => step(-1)); $("next").addEventListener("click", () => step(1));
    const fullscreen = () => document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : $("player").requestFullscreen().catch(() => toast("Full screen isn't available here.", true));
    $("fs").addEventListener("click", fullscreen);
    $("pip").hidden = !document.pictureInPictureEnabled;
    $("pip").addEventListener("click", () => (document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture()).catch(() => toast("Pop out isn't available for this video.", true)));
    const syncWide = () => $("wrap").classList.toggle("wide", S.wide);
    $("list1").addEventListener("click", () => { S.wide = !S.wide; syncWide(); save(); }); syncWide();
    // subtitles: .vtt as they are; .srt turned into .vtt
    $("subs").addEventListener("click", async () => {
      if (!v.src) return;
      const [f] = await pickFiles({ accept: ".vtt,.srt,text/vtt" }); if (!f) return;
      let text = await f.text();
      if (/\.srt$/i.test(f.name) || !/^WEBVTT/.test(text.trim())) text = "WEBVTT\n\n" + text.replace(/\r/g, "").replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2");
      [...v.querySelectorAll("track")].forEach(t => t.remove());
      const tr = document.createElement("track"); tr.kind = "subtitles"; tr.label = f.name; tr.default = true; tr.src = URL.createObjectURL(new Blob([text], { type: "text/vtt" }));
      v.appendChild(tr); tr.addEventListener("load", () => { tr.track.mode = "showing"; }); tr.track.mode = "showing"; flash("SUBTITLES ON");
    });
    const subsToggle = () => { const t = v.textTracks[0]; if (!t) return; t.mode = t.mode === "showing" ? "hidden" : "showing"; flash(t.mode === "showing" ? "SUBTITLES ON" : "SUBTITLES OFF"); };
    // the controls hide while a video plays and the mouse rests
    let idleT = 0; const wake = () => { $("player").classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (!v.paused) $("player").classList.add("idle"); }, 2500); };
    $("player").addEventListener("pointermove", wake); v.addEventListener("play", wake); v.addEventListener("pause", wake);
    addEventListener("keydown", e => {
      if (e.target.closest("input, select, textarea, .dialog") || e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key.toLowerCase(); let done = true;
      if (k === " " || k === "k") toggle(); else if (k === "j") $("back").click(); else if (k === "l") $("fwd").click();
      else if (e.key === "ArrowLeft" && !e.target.closest(".slider")) { v.currentTime = Math.max(0, v.currentTime - 5); flash("−5 S"); }
      else if (e.key === "ArrowRight" && !e.target.closest(".slider")) { v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); flash("+5 S"); }
      else if (e.key === "ArrowUp" && !e.target.closest(".slider")) { vol.set(Math.min(1, S.vol + 0.05), true); flash(Math.round(S.vol * 100) + "%"); save(); }
      else if (e.key === "ArrowDown" && !e.target.closest(".slider")) { vol.set(Math.max(0, S.vol - 0.05), true); flash(Math.round(S.vol * 100) + "%"); save(); }
      else if (k === "f") fullscreen(); else if (k === "m") $("mute").click(); else if (k === "n") step(1); else if (k === "p") step(-1); else if (k === "c") subsToggle();
      else if (k === "]" || k === "[") { const sp = [0.5, 0.75, 1, 1.25, 1.5, 2], i = Math.max(0, Math.min(sp.length - 1, sp.indexOf(S.speed) + (k === "]" ? 1 : -1))); S.speed = sp[i]; $("speed").value = String(S.speed); v.playbackRate = S.speed; flash(S.speed + "×"); save(); }
      else done = false;
      if (done) { e.preventDefault(); wake(); }
    });
    addEventListener("pagehide", remember);
    applyVol(); await loadFolders(); refresh(false);
    if (parent !== window) parent.postMessage({ neonOs: "ready", app: "video" }, location.origin);
  </script>
</body>
</html>
