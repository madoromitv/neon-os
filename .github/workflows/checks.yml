# Runs on every push and pull request: checks the offline file list is up to date, then opens Neon OS and
# every app in a headless browser and runs the tests in tests/run.mjs.
name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Offline file list is up to date
        run: |
          python tools/precache.py
          git diff --exit-code sw.js version.json || (echo "::error::sw.js or version.json is out of date. Run: python tools/precache.py" && exit 1)
      - name: Install the test browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python tests/fixtures.py
          node tests/run.mjs
