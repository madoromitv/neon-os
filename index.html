<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="style-kit/tokens.css">
<link rel="stylesheet" href="style-kit/base.css">
<link rel="stylesheet" href="style-kit/chrome.css">
<style>
  body { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .launcher { width: min(640px, 100%); }
  .launcher .wbody { padding: 14px; gap: 14px; }
  .hero { padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .orb { width: 28px; height: 28px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 18px 4px var(--ball-dim), 0 0 4px #fff inset; flex: none; }
  .hero b { display: block; font-size: 34px; line-height: 1; letter-spacing: 3px; }
  .hero span { font-size: 18px; opacity: .75; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .app { display: grid; gap: 4px; padding: 12px; text-decoration: none; color: var(--ink); border: 1px solid var(--edge); border-radius: 3px;
    background: linear-gradient(180deg, #423c57, #26222f); box-shadow: inset 1px 1px 0 #6a6286, inset -1px -1px 0 #17141f; }
  a.app:hover { background: linear-gradient(180deg, #4b4462, #2b2735); }
  .app .top { display: flex; align-items: center; justify-content: space-between; }
  .app strong { font-size: 14px; letter-spacing: .08em; }
  .app small { color: var(--ink-dim); font-size: 11.5px; }
  .app .led { width: 7px; height: 7px; border-radius: 1px; background: #1a1622; box-shadow: inset 0 0 0 1px #000; }
  a.app .led { background: var(--ball); box-shadow: 0 0 6px var(--ball), inset 0 0 2px #fff; }
  .app.soon { opacity: .5; cursor: default; }
  .foot { font-size: 11.5px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>
  <main class="win lit launcher" aria-label="Neon OS">
    <div class="titlebar"><span class="ttl">Neon OS</span></div>
    <div class="wbody">
      <div class="lcd hero"><i class="orb" aria-hidden="true"></i><div><b>NEON OS</b><span>SYSTEMS ONLINE &middot; 1 OF 5</span></div></div>
      <span class="lbl">Apps</span>
      <nav class="apps">
        <a class="app" href="apps/amp/"><span class="top"><strong>AMP</strong><i class="led"></i></span><small>Player, library, visualiser</small></a>
        <div class="app soon"><span class="top"><strong>ORBIT</strong><i class="led"></i></span><small>Visualiser, coming</small></div>
        <div class="app soon"><span class="top"><strong>PULSE</strong><i class="led"></i></span><small>Drum machine, planned</small></div>
        <div class="app soon"><span class="top"><strong>DECKS</strong><i class="led"></i></span><small>DJ mixer, planned</small></div>
        <div class="app soon"><span class="top"><strong>DRIFT</strong><i class="led"></i></span><small>Synth, planned</small></div>
      </nav>
      <p class="foot">Your songs stay in this browser. Nothing is uploaded.</p>
    </div>
  </main>
</body>
</html>
