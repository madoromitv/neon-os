<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks · Neon OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="../../style-kit/tokens.css">
<link rel="stylesheet" href="../../style-kit/base.css">
<link rel="stylesheet" href="../../style-kit/chrome.css">
<link rel="stylesheet" href="../../style-kit/library.css">
<link rel="stylesheet" href="decks.css">
</head>
<body>
  <div class="console">
    <section class="deck" data-deck="A" aria-label="Deck A"></section>
    <section class="mixer" aria-label="Mixer">
      <div class="chans">
        <div class="chan" data-ch="A">
          <span class="lbl">A</span>
          <div class="eq"><span class="lbl">Hi</span><div class="slider h center" data-eq="A-hi"></div><span class="eqv" data-eqv="A-hi">0</span></div>
          <div class="eq"><span class="lbl">Mid</span><div class="slider h center" data-eq="A-mid"></div><span class="eqv" data-eqv="A-mid">0</span></div>
          <div class="eq"><span class="lbl">Low</span><div class="slider h center" data-eq="A-low"></div><span class="eqv" data-eqv="A-low">0</span></div>
          <div class="eq"><span class="lbl">Filter</span><div class="slider h center" data-filter="A"></div><span class="eqv fxv" data-filterv="A">OFF</span></div>
          <div class="eq echo"><button class="btn mini" data-echo="A" aria-pressed="false" title="Echo in time with the deck's tempo"><i class="led"></i>Echo</button><select data-echob="A" aria-label="Echo length"><option value="0.25">1/16</option><option value="0.5">1/8</option><option value="0.75">3/16</option><option value="1">1/4</option></select></div>
          <div class="fader"><div class="meter"><i data-meter="A"></i></div><div class="slider v" data-fader="A"></div></div>
          <span class="lcd pct fpct" data-fpct="A">85%</span>
        </div>
        <div class="chan" data-ch="B">
          <span class="lbl">B</span>
          <div class="eq"><span class="lbl">Hi</span><div class="slider h center" data-eq="B-hi"></div><span class="eqv" data-eqv="B-hi">0</span></div>
          <div class="eq"><span class="lbl">Mid</span><div class="slider h center" data-eq="B-mid"></div><span class="eqv" data-eqv="B-mid">0</span></div>
          <div class="eq"><span class="lbl">Low</span><div class="slider h center" data-eq="B-low"></div><span class="eqv" data-eqv="B-low">0</span></div>
          <div class="eq"><span class="lbl">Filter</span><div class="slider h center" data-filter="B"></div><span class="eqv fxv" data-filterv="B">OFF</span></div>
          <div class="eq echo"><button class="btn mini" data-echo="B" aria-pressed="false" title="Echo in time with the deck's tempo"><i class="led"></i>Echo</button><select data-echob="B" aria-label="Echo length"><option value="0.25">1/16</option><option value="0.5">1/8</option><option value="0.75">3/16</option><option value="1">1/4</option></select></div>
          <div class="fader"><div class="meter"><i data-meter="B"></i></div><div class="slider v" data-fader="B"></div></div>
          <span class="lcd pct fpct" data-fpct="B">85%</span>
        </div>
      </div>
      <div class="xrow"><span class="lbl">A</span><div class="slider h center" id="xfade"></div><span class="lbl">B</span><span class="lcd pct" id="xfPct">C</span></div>
      <div class="mrow m3"><span class="lbl">Master</span><div class="slider h" id="master"></div><span class="lcd pct" id="masterPct">85%</span></div>
      <div class="mrow"><button class="btn" id="reset" title="Stop and empty both decks, flatten the mixer">Reset decks</button><span></span></div>
      <div class="mrow"><button class="btn" id="rec" aria-pressed="false"><i class="led rec"></i>Record mix</button><span class="lcd rectime" id="recTime">0:00</span></div>
    </section>
    <section class="deck" data-deck="B" aria-label="Deck B"></section>
  </div>
  <section class="crate" aria-label="Library">
    <nav class="ltree" id="tree" aria-label="Library sections"></nav>
    <div class="crate-main">
      <div class="crate-top"><button class="btn" id="back" hidden>‹ Back</button><span class="lbl" id="crateTitle">All songs</span><label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search the library"></label><span class="hint" id="crateHint"></span></div>
      <div class="lwell" id="list" role="grid" aria-label="Songs">
        <div class="lhead" role="row" id="head"><span data-sort="fav">★</span><span data-sort="title">Title</span><span data-sort="artist">Artist</span><span data-sort="genre">Genre</span><span data-sort="bpm" style="text-align:right">BPM</span><span data-sort="duration" style="text-align:right">Time</span><span></span><span></span></div>
        <div id="rows"></div>
      </div>
    </div>
  </section>
  <script type="module" src="decks.js"></script>
</body>
</html>
